<div class="products-container">

  @if (productsService.errorMessage()) {
  <div class="error-banner">
    {{ productsService.errorMessage() }}
  </div>
  }

  <h2>Available Products</h2>

  @for (product of productsService.products(); track product) {
    <div class="product-card">
      
      <!-- Product row -->
      <div class="product-main-row">
        <div class="product-image-container">
          <img 
            [src]="product.image ? product.image : '/sample-image.png'" 
            [alt]="product.name" 
            class="product-image" 
          />
        </div>

        <div class="product-info-col">
          <h3 class="product-title">{{ product.name }}</h3>
          <div class="title-divider"></div>
          <p class="description">{{ product.description }}</p>
          <div class="price"><strong>Price:</strong> ${{ product.price }}</div>
        </div>

        <div class="product-actions-col">
          <label>
            quantity:
            <input
              #quantityInput
              type="number"
              min="1"
              max="12"
              value="1"
              class="quantity-input"
            />
          </label>

          <button
            class="btn-add"
            (click)="productsService.onAddToCart(product, quantityInput.valueAsNumber)">
            Add to cart
          </button>
        </div>

      </div>

    </div>
  } @empty {
    <p>No products found or still loading...</p>
  }
</div>
